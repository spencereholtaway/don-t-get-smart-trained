<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About · don't get smart trained</title>
<meta name="apple-mobile-web-app-title" content="don't get smart trained">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<style>
  :root {
    --bg: #e9ece8; --panel: rgba(255,255,255,.88); --fg: #1c241e; --muted: #5d6b61;
    --line: rgba(28,36,30,.12); --accent: #4d6d51;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1411; --panel: rgba(24,30,26,.86); --fg: #e8eee9; --muted: #9aa89e;
      --line: rgba(232,238,233,.12); --accent: #8fbf8f; color-scheme: dark; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); }
  main { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-weight: 600; padding: 6px 0; }
  .back svg { width: 18px; height: 18px; }
  .coffee { margin: 20px 0; }
  .credits { list-style: none; padding: 0; margin: 0; }
  .credits li { padding: 10px 0; border-top: 1px solid var(--line); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <a class="back" href="./">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    Map
  </a>
  <div class="coffee">
    <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="holtaway" data-color="#FFDD00" data-emoji="☕"  data-font="Arial" data-text="Like this? Buy me a coffee!" data-outline-color="#000000" data-font-color="#000000" data-coffee-color="#ffffff" ></script>
  </div>

  <ul class="credits">
    <li>Maps from <a href="https://openfreemap.org">OpenFreeMap</a> and <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a></li>
    <li>Timetable and live data from <a href="https://511.org/open-data/transit">511.org</a></li>
    <li>Predicted traffic based on a <a href="https://www.sonomamarintrain.org/sites/default/files/Board/COC%20Documents/Item%20%237-%20San%20Rafael%20Gate%20Down%20Time%20Presentation_04.06.2022_0.pdf">report from sonomamarintrain.org</a></li>
    <li>All times are estimates. Always follow the crossing signals.</li>
  </ul>
</main>
</body>
</html>
